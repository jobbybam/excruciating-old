name: Import Scratch Geometry Dash files

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-games.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-scratch-game:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Import the Scratch/TurboWarp game and its licence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p games/geometry-dash
          curl --fail --location --retry 3 https://raw.githubusercontent.com/AJ2130/Geometry-dash-/main/Geometry_Dash_Styled.html --output games/geometry-dash/index.html
          curl --fail --location --retry 3 https://raw.githubusercontent.com/AJ2130/Geometry-dash-/main/LICENSE --output games/geometry-dash/LICENSE
          python3 - <<'PY'
          from pathlib import Path
          import re
          entry = Path("games/geometry-dash/index.html")
          html = entry.read_text(encoding="utf-8")
          html, count = re.subn(r"<title>.*?</title>", "<title>Geometry Dash — Scratch Fan Game</title>", html, count=1, flags=re.IGNORECASE | re.DOTALL)
          if count:
              entry.write_text(html, encoding="utf-8")
          if len(html) < 100000:
              raise SystemExit("Imported HTML is unexpectedly small; refusing to commit.")
          Path("games/geometry-dash/ATTRIBUTION.md").write_text(
              "# Geometry Dash — Scratch/TurboWarp fan game\n\n"
              "This is a third-party Scratch/TurboWarp-made fan game exported as a self-contained HTML file. "
              "It is **not** the official Geometry Dash game and is not affiliated with RobTop Games.\n\n"
              "- Upstream repository: https://github.com/AJ2130/Geometry-dash-\n"
              "- Upstream author: Ajaykrishna Ramesh (AJ2130)\n"
              "- Code licence: MIT; the original licence text is in this folder's LICENSE file.\n"
              "- Game engine/export: Scratch / TurboWarp.\n",
              encoding="utf-8",
          )
          PY
      - name: Commit the game files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/geometry-dash/
          git commit -m "Add self-hosted Scratch Geometry Dash fan game" || echo "No file changes to commit."
          git push
